<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | JaguarX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../data/productos.js" defer></script>
  <script src="../scripts/productos.js" defer></script>
</head>

<body class="d-block p-4">

  <!-- Encabezado con acceso al carrito -->
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
    <div>
      <h1 class="mb-1">Productos</h1>
      <p class="text-white-50 mb-0">Equipamiento JaguarX para cada kilómetro y cada estación de HYROX.</p>
    </div>
    <a href="#carrito" class="btn btn-outline-warning fw-bold">
      🛒 Carrito <span id="carrito-contador" class="badge text-bg-warning ms-1">0</span>
    </a>
  </div>

  <!-- Navegación del carrusel -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3" aria-label="Ir a producto">
    <span class="text-white-50 small me-1">Desliza →</span>
  </div>

  <!-- Carrusel  -->
  <section class="d-flex flex-nowrap overflow-x-auto gap-3 pb-3" aria-label="Carrusel de productos">
    <p class="text-white-50">Cargando productos…</p>
  </section>

  <!--  Carrito de compras  -->
  <section id="carrito" class="card text-bg-dark border-warning mt-4" aria-labelledby="titulo-carrito">
    <div class="card-body p-4">
      <h2 id="titulo-carrito" class="h4 mb-3">🛒 Tu carrito</h2>

      <!-- Aviso de compra realizada -->
      <div id="carrito-aviso" class="alert alert-success d-none" role="status"></div>

      <p id="carrito-vacio" class="text-white-50">Tu carrito está vacío.</p>
      <ul id="carrito-lista" class="list-group mb-3 d-none"></ul>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 border-top border-secondary pt-3">
        <p class="fs-5 mb-0">
          Total: <span id="carrito-total" class="fw-bold text-warning">$0.00 MXN</span>
        </p>
        <div class="d-flex gap-2">
          <button id="carrito-vaciar" type="button" class="btn btn-outline-light" disabled>Vaciar</button>
          <button id="carrito-comprar" type="button" class="btn btn-warning fw-bold" disabled>Comprar</button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
